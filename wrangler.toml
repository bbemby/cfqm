name = "cfqm"
main = "src/index.ts"
compatibility_date = "2024-09-24"

# KV 绑定：存储配置（渠道、规则、embyboss 联动等）
[[kv_namespaces]]
binding = "CONFIG"
id = "4cf96e262bee497c8d08a2f5e1b6661d"

# 普通环境变量（在 Cloudflare 控制台可见可改）
[vars]
WHITELIST_TITLE = "尊敬的白名单用户"

# Secrets（敏感信息用 wrangler secret put 设置，不写在这里）
# 必填：
#   wrangler secret put TG_ADMIN_BOT_TOKEN
#   wrangler secret put TG_WEBHOOK_SECRET
#   wrangler secret put TG_ADMIN_CHAT_ID
#   wrangler secret put EMBY_SERVER_URL
#   wrangler secret put EMBY_API_KEY
# 可选：
#   wrangler secret put EMBYBOSS_API_URL
#   wrangler secret put EMBYBOSS_BOT_TOKEN
